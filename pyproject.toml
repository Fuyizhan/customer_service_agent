[project]
name = "customer-service-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "fyz", email = "1817295253@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.1",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint>=4.3.2",
    "openai>=3.52.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
